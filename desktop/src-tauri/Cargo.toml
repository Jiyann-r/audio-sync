[package]
name = "audio-sync-desktop"
version = "0.1.0"
description = "Bi-Directional Low-Latency Audio Sync & Wireless Mic Companion for Windows"
authors = ["AudioSync"]
edition = "2021"

[lib]
name = "audio_sync_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
rusty-opus = "1.0"
nnnoiseless = "0.5"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.11"
global-hotkey = "0.6"
parking_lot = "0.12"
thiserror = "1.0"
log = "0.4"
