name: AudioSync
options:
  bundleIdPrefix: com.audiosync
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone (iPhone 13, iOS 15+)
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
targets:
  AudioSync:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AudioSync
        excludes:
          - Info.plist
    info:
      path: AudioSync/Info.plist
      properties:
        UIBackgroundModes:
          - audio
          - voip
        NSMicrophoneUsageDescription: "AudioSync Pro needs microphone access to stream low-latency wireless audio from your iPhone 13 to your Windows PC (including in the background)."
        NSLocalNetworkUsageDescription: "AudioSync Pro uses your local Wi-Fi network to auto-discover your Windows PC via Bonjour/mDNS and stream real-time bidirectional Opus audio over UDP."
        NSBonjourServices:
          - _audiosync._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiosync.ios.client
        INFOPLIST_FILE: AudioSync/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
